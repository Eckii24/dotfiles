[settings]
task.output = "prefix"
task.run_auto_install = false

# Protected resolver for Pi. Stack-specific policy and tasks live in
# directory-level mise.toml files (for example ~/Development/Repos/mise.toml).
[tasks."pi:quality-gate:project-root"]
description = "Print the current Git repository root for the Pi quality gate"
run = 'git -C "$MISE_ORIGINAL_CWD" rev-parse --show-toplevel'

# Fail-closed diagnostics for directories without a stack config. Pi rejects
# these global task sources as a quality-gate contract.
[tasks.format]
description = "Project must define task: format"
run = "printf 'Project must define task: format\\n' >&2; exit 2"

[tasks.lint]
description = "Project must define task: lint"
run = "printf 'Project must define task: lint\\n' >&2; exit 2"

[tasks.build]
description = "Project must define task: build"
run = "printf 'Project must define task: build\\n' >&2; exit 2"

[tasks.test]
description = "Project must define task: test"
run = "printf 'Project must define task: test\\n' >&2; exit 2"

[tasks."test:integration"]
description = "Project must define task: test:integration"
run = "printf 'Project must define task: test:integration\\n' >&2; exit 2"

[tasks.verify]
description = "Run project formatting, linting, build, and tests serially"
run = [
  { task = "format" },
  { task = "lint" },
  { task = "build" },
  { task = "test" },
]

[tasks."verify:full"]
description = "Run the complete project verification suite"
run = [{ task = "verify" }, { task = "test:integration" }]
