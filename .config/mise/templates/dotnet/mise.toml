# Shared .NET quality-gate defaults for repositories below ~/Development/Repos.
# The global ~/.config/mise/config.toml owns only the protected Git-root resolver.

[env]
PI_QUALITY_GATE_INCLUDE = '''
[
  "**/*.cs",
  "**/*.csproj",
  "**/*.props",
  "**/*.targets",
  "**/*.sln",
  "**/*.slnx",
  "**/.editorconfig",
  "Directory.Build.props",
  "Directory.Build.targets",
  "Directory.Packages.props",
  "global.json",
  "NuGet.config",
  "nuget.config",
  "packages.lock.json"
]
'''
PI_QUALITY_GATE_EXCLUDE = '''
[
  "**/bin/**",
  "**/obj/**"
]
'''

[tasks.format]
description = "Verify .NET formatting without modifying files"
run = [
  'cd "$MISE_ORIGINAL_CWD" && dotnet-in-repo format style --verify-no-changes',
  'cd "$MISE_ORIGINAL_CWD" && csharpier check .',
]

[tasks."format:apply"]
description = "Apply .NET formatting changes"
confirm = "Apply dotnet formatting changes?"
run = [
  'cd "$MISE_ORIGINAL_CWD" && dotnet-in-repo format style',
  'cd "$MISE_ORIGINAL_CWD" && csharpier format .',
]

[tasks.lint]
description = "Verify .NET analyzer diagnostics without modifying files"
run = 'cd "$MISE_ORIGINAL_CWD" && dotnet-in-repo format analyzers --verify-no-changes'

[tasks.build]
description = "Build the convention-resolved .NET target"
run = 'cd "$MISE_ORIGINAL_CWD" && dotnet-in-repo build -p:TreatWarningsAsErrors=false -p:WarningsAsErrors='

[tasks.test]
description = "Run the convention-resolved unit-test project"
run = 'cd "$MISE_ORIGINAL_CWD" && dotnet-in-repo test-kind unit -- -p:TreatWarningsAsErrors=false -p:WarningsAsErrors='

[tasks."test:integration"]
description = "Run the convention-resolved integration-test project"
run = 'cd "$MISE_ORIGINAL_CWD" && dotnet-in-repo test-kind integration -- -p:TreatWarningsAsErrors=false -p:WarningsAsErrors='

[tasks.verify]
description = "Run project formatting, linting, build, and tests serially"
run = [
  { task = "format" },
  # { task = "lint" },
  { task = "build" },
  { task = "test" },
]

[tasks."verify:full"]
description = "Run the complete project verification suite"
run = [{ task = "verify" }, { task = "test:integration" }]
