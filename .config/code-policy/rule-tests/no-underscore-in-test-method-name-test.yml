id: no-underscore-in-test-method-name

valid:
- |
  using Xunit;

  class Tests
  {
      [Fact]
      public void DoesSomething() { }

      [Theory]
      public async Task DoesSomethingElse(int input_value) { }

      public void Helper_method() { }

      [Fact]
      public void DoesSomethingWithUnderscoreInBody()
      {
          var input_value = 1;
          Assert.Equal(1, input_value);
      }
  }
